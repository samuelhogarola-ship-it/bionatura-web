name: Build static site for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish dist
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v6
        with:
          name: hostinger-dist
          path: dist
          if-no-files-found: error

      - name: Publish dist branch for Hostinger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          cp -R dist/. "$publish_dir/"
          cd "$publish_dir"

          git init
          git checkout -b hostinger-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build Hostinger static site from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-deploy
